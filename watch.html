<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مشاهدة البث | LevelLive</title>

    <link rel="stylesheet" href="./watch.css">
</head>

<body>

<header>

    <a href="./index.html">
        LevelLive
    </a>

    <nav>
        <a href="./index.html">
            الرئيسية
        </a>

        <a href="./creator-dashboard.html">
            لوحة Creator
        </a>
    </nav>

</header>


<main>

    <!-- ========================= -->
    <!-- VIDEO -->
    <!-- ========================= -->

    <section>

        <div id="player">

            <div>

                <b>▶</b>

                <h2 id="playerTitle">
                    جاري تحميل البث...
                </h2>

                <p>
                    سيتم ربط الفيديو الحقيقي بخادم البث.
                </p>

            </div>

        </div>


        <!-- STREAM INFO -->

        <div class="info">

            <div>

                <span id="liveBadge">
                    OFFLINE
                </span>

                <span id="viewerCount">
                    0 مشاهد
                </span>


                <h1 id="streamTitle">
                    —
                </h1>


                <p id="description">
                    —
                </p>

            </div>


            <button id="follow">
                ♡ متابعة
            </button>

        </div>


        <!-- CREATOR -->

        <div class="creator">

            <div id="avatar">
                L
            </div>


            <div>

                <h3 id="creatorName">
                    Creator
                </h3>

                <small id="username">
                    @creator
                </small>

            </div>


            <em>
                CREATOR
            </em>

        </div>

    </section>


    <!-- ========================= -->
    <!-- CHAT -->
    <!-- ========================= -->

    <aside>

        <div class="chathead">

            <b>
                الدردشة المباشرة
            </b>

            <span>
                متصل
            </span>

        </div>


        <div id="messages">

            <div class="system">
                مرحبًا بك في LevelLive 👋
            </div>

        </div>


        <form id="chat">

            <input
                id="message"
                maxlength="300"
                placeholder="اكتب رسالة..."
                autocomplete="off"
            >

            <button>
                إرسال
            </button>

        </form>


        <div id="loginHint" hidden>
            سجّل الدخول للمشاركة في الدردشة.
        </div>

    </aside>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="./supabase.js"></script>

<script src="./watch.js"></script>

</body>
</html>
