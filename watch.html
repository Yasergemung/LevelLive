<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مشاهدة البث | LevelLive</title>

    <link rel="stylesheet" href="./watch.css">
</head>

<body>

<header>

    <a href="./index.html" class="logo">
        LevelLive
    </a>

    <nav>
        <a href="./index.html">
            الرئيسية
        </a>

        <a href="./creator-dashboard.html">
            لوحة Creator
        </a>
    </nav>

</header>


<main>

    <!-- ========================= -->
    <!-- VIDEO PLAYER -->
    <!-- ========================= -->

    <section class="watch-section">

        <div id="player" class="player">

            <div class="player-content">

                <div class="player-icon">
                    ▶
                </div>

                <h2 id="playerTitle">
                    جاري تحميل البث...
                </h2>

                <p id="playerStatus">
                    جارٍ الاتصال بالبث المباشر
                </p>

            </div>

        </div>


        <!-- ========================= -->
        <!-- STREAM INFO -->
        <!-- ========================= -->

        <div class="info">

            <div class="info-content">

                <div class="stream-status">

                    <span id="liveBadge" class="offline">
                        OFFLINE
                    </span>

                    <span id="viewerCount">
                        0 مشاهد
                    </span>

                    <span id="streamCategory">
                        Gaming
                    </span>

                </div>


                <h1 id="streamTitle">
                    جاري تحميل البث...
                </h1>


                <p id="description">
                    جاري تحميل وصف البث...
                </p>

            </div>


            <button id="follow" type="button">
                ♡ متابعة
            </button>

        </div>


        <!-- ========================= -->
        <!-- CREATOR -->
        <!-- ========================= -->

        <div class="creator">

            <div id="avatar" class="creator-avatar">
                L
            </div>


            <div class="creator-info">

                <h3 id="creatorName">
                    Creator
                </h3>

                <small id="username">
                    @creator
                </small>

            </div>


            <em>
                CREATOR
            </em>

        </div>

    </section>


    <!-- ========================= -->
    <!-- LIVE CHAT -->
    <!-- ========================= -->

    <aside class="chat">

        <div class="chathead">

            <b>
                الدردشة المباشرة
            </b>

            <span>
                ● متصل
            </span>

        </div>


        <div id="messages" class="messages">

            <div class="system">
                مرحبًا بك في LevelLive 👋
            </div>

        </div>


        <form id="chat">

            <input
                id="message"
                type="text"
                maxlength="300"
                placeholder="اكتب رسالة..."
                autocomplete="off"
            >

            <button type="submit">
                إرسال
            </button>

        </form>


        <div id="loginHint" hidden>
            سجّل الدخول للمشاركة في الدردشة.
        </div>

    </aside>

</main>


<!-- ========================= -->
<!-- SUPABASE -->
<!-- ========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="./supabase.js"></script>

<script src="./watch.js"></script>

</body>
</html>
